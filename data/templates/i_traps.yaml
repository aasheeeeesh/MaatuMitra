# (i) Trap sentences: words that LOOK like negation but are not (ಎಲ್ಲ, ಎಲ್ಲಾ, ಇಲ್ಲಿ, ಅಲ್ಲಿ,
# ಅಲ್ವಾ, ಅಲ್ವ, ಮಾತ್ರ, ಮಾತ್ರೆ, ಬಂದಿದೆ, ಇದ್ದರೆ, ಓದಿದ್ದರೆ, ಬೇಡಿಕೆ), and negation next to
# non-negated clauses. Not native-validated.
category: i
families:
  - id: i_traps__f1
    templates:
      - id: i1
        encounter: physician_consult
        grounding: [KN-2]
        slots:
          D1: {type: drug, dose: given, needs: [freq]}
        turns:
          - {role: physician, text: "[[m1|{D1.name} {D1.dose} {D1.freq}]] ಮಾತ್ರ ತೆಗೆದುಕೊಳ್ಳಿ."}
          - {role: patient, text: "ಎಲ್ಲಾ ಮಾತ್ರೆ ಇಲ್ಲಿ ಇವೆ, ಅಲ್ವಾ?"}
        items:
          - {kind: medication, span: m1, slot: D1, fields: [dose, freq]}
      - id: i2
        encounter: pharmacist_dispensing
        grounding: [KN-2]
        slots:
          D1: {type: drug, dose: given, needs: [freq, dur]}
        turns:
          - {role: pharmacist, text: "[[m1|{D1.name} {D1.dose_tab} {D1.freq} {D1.dur}]] ತೆಗೆದುಕೊಳ್ಳಿ."}
          - {role: patient, text: "ಆಸ್ಪತ್ರೆ ಅಲ್ಲಿ ಇದೆಯಾ?"}
          - {role: pharmacist, text: "ಹೌದು, ಅಲ್ಲಿ ಇದೆ. [[a1|ಎಲ್ಲ ಮಾತ್ರೆ ಮುಗಿಸಿ]]."}
        items:
          - {kind: medication, span: m1, slot: D1, fields: [dose, freq, dur]}
          - {kind: advice, span: a1, text: "finish all tablets"}
      - id: i3
        encounter: pharmacist_dispensing
        grounding: [KN-2]
        slots:
          D1: {type: drug, dose: given, needs: [freq, dur]}
        turns:
          - {role: pharmacist, text: "ಈ ಮಾತ್ರೆಗೆ ತುಂಬಾ ಬೇಡಿಕೆ ಇದೆ."}
          - {role: pharmacist, text: "[[m1|{D1.name} {D1.dose_tab} {D1.freq} {D1.dur}]] ತೆಗೆದುಕೊಳ್ಳಿ."}
          - {role: patient, text: "[[a1|ಊಟದ ನಂತರ ತೆಗೆದುಕೊಳ್ಳಬೇಕು]], ಅಲ್ವ?"}
          - {role: pharmacist, text: "ಹೌದು."}
        items:
          - {kind: medication, span: m1, slot: D1, fields: [dose, freq, dur]}
          - {kind: advice, span: a1, text: "take after food"}
      - id: i4
        encounter: pharmacist_dispensing
        grounding: [KN-1]
        slots:
          D1: {type: drug, dose: given, needs: [freq]}
        turns:
          - {role: patient, text: "ಈ ಮಾತ್ರೆ ಎಷ್ಟು ಸಲ ತೆಗೆದುಕೊಳ್ಳಬೇಕು?"}
          - {role: pharmacist, text: "ಚೀಟಿ ಓದಿದ್ದರೆ ಗೊತ್ತಾಗುತ್ತಿತ್ತು. [[m1|{D1.name} {D1.dose_tab} {D1.freq}]] ತೆಗೆದುಕೊಳ್ಳಿ."}
        items:
          - {kind: medication, span: m1, slot: D1, fields: [dose, freq]}
      - id: i5
        encounter: asha_household_visit
        grounding: [KN-2]
        slots:
          D1: {type: drug, where: {generic: [paracetamol]}, dose: child_syrup}
        turns:
          - {role: caregiver, text: "ಮಗುವಿಗೆ [[s1|ಜ್ವರ ಬಂದಿದೆ]]."}
          - {role: asha, text: "[[a1|ಜ್ವರ ಇದ್ದರೆ ಮಾತ್ರ]] [[m1|{D1.name} ಸಿರಪ್ {D1.dose}]] ಕೊಡಿ."}
        items:
          - {kind: symptom, span: s1, name: fever}
          - {kind: medication, span: m1, slot: D1, fields: [dose]}
          - {kind: advice, span: a1, text: "only if there is fever"}
  - id: i_traps__f2
    templates:
      - id: i6
        encounter: physician_consult
        grounding: [KN-2]
        slots:
          S1: {type: symptom, pool: [fever, cough, headache]}
          N1: {type: neg, forms: EXIST_PHRASE, subject: S1, p_neg: 0.8}
          D1: {type: drug, dose: given}
        turns:
          - {role: patient, text: "ಏನು ಮಾಡಬೇಕು ಡಾಕ್ಟರ್?"}
          - {role: physician, text: "[[s1|{N1}]], [[m1|{D1.name} {D1.dose_tab}]] ಮಾತ್ರ ತೆಗೆದುಕೊಳ್ಳಿ."}
        items:
          - {kind: symptom, span: s1, slot: S1, neg: N1}
          - {kind: medication, span: m1, slot: D1, fields: [dose]}
      - id: i7
        encounter: pharmacist_dispensing
        grounding: [KN-1]
        slots:
          D1: {type: drug, dose: given, needs: [freq, dur]}
          D2: {type: drug, dose: none, distinct_from: [D1]}
          N1:
            type: neg
            p_neg: 0.8
            forms:
              - {neg: "ಬೇಡ", pos: "ಕೂಡ ತೆಗೆದುಕೊಳ್ಳಿ", patterns: [NEG-W04]}
              - {neg: "ತೆಗೆದುಕೊಳ್ಳಬೇಡಿ", pos: "ತೆಗೆದುಕೊಳ್ಳಿ", patterns: [NEG-S06]}
        turns:
          - {role: pharmacist, text: "ಎಲ್ಲಾ ಮಾತ್ರೆ ಇಲ್ಲಿ ಇವೆ."}
          - {role: pharmacist, text: "[[m1|{D1.name} {D1.dose_tab} {D1.freq} {D1.dur}]] ತೆಗೆದುಕೊಳ್ಳಿ, [[m2|{D2.name} {N1}]]."}
        items:
          - {kind: medication, span: m1, slot: D1, fields: [dose, freq, dur]}
          - {kind: medication, span: m2, slot: D2, neg: N1}
      - id: i8
        encounter: pharmacist_dispensing
        grounding: [KN-3]
        slots:
          D1: {type: drug, dose: given, needs: [freq]}
          N1: {type: neg, p_neg: 1.0, forms: [{neg: "ತೆಗೆದುಕೊಳ್ಳಬೇಡಿ", pos: "ತೆಗೆದುಕೊಳ್ಳಿ", patterns: [NEG-S06]}]}
        turns:
          - {role: patient, text: "ಈ ಮಾತ್ರೆ ಜಾಸ್ತಿ ತಗೊಂಡ್ರೆ ಏನಾಗುತ್ತದೆ?"}
          - {role: pharmacist, text: "[[m1|{D1.name} {D1.dose_tab} {D1.freq}]] ಮಾತ್ರ ತೆಗೆದುಕೊಳ್ಳಿ, [[a1|ಜಾಸ್ತಿ {N1}]]."}
        items:
          - {kind: medication, span: m1, slot: D1, fields: [dose, freq]}
          - {kind: advice, span: a1, text: "do not take more", neg: N1}
