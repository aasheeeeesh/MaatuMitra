# (d) Advice: do not take antibiotics for a cold (ಬಾರದು / ಬೇಡ). Not native-validated.
category: d
families:
  - id: d_no_antibiotic__f1
    templates:
      - id: d1
        encounter: physician_consult
        grounding: [KN-1, KN-3, KN-2]
        slots:
          K1: {type: count, values: [2, 3, 4]}
          AB: {type: word, choices: ["ಆಂಟಿಬಯಾಟಿಕ್", "antibiotic", "ಪ್ರತಿಜೈವಿಕ"]}
          D1: {type: drug, where: {class: [analgesic_antipyretic, antihistamine]}, dose: given, needs: [freq, dur]}
          N1: {type: neg, p_neg: 1.0, forms: NO_ANTIBIOTIC}
        turns:
          - {role: patient, text: "[[s1|ನೆಗಡಿ]] ಮತ್ತು [[s2|ಕೆಮ್ಮು]] {K1.kn} ದಿನದಿಂದ ಇದೆ, ಆಂಟಿಬಯಾಟಿಕ್ ಕೊಡಿ."}
          - {role: physician, text: "[[a1|ನೆಗಡಿಗೆ {AB} {N1}]]."}
          - {role: physician, text: "[[m1|{D1.name} {D1.dose_tab} {D1.freq} {D1.dur}]] ತೆಗೆದುಕೊಳ್ಳಿ."}
        items:
          - {kind: symptom, span: s1, name: cold}
          - {kind: symptom, span: s2, name: cough}
          - {kind: advice, span: a1, text: "do not take antibiotics for a cold", neg: N1}
          - {kind: medication, span: m1, slot: D1, fields: [dose, freq, dur]}
      - id: d2
        encounter: pharmacist_dispensing
        grounding: [KN-3]
        slots:
          D1: {type: drug, where: {class: [antibiotic]}, dose: none}
          N1: {type: neg, p_neg: 1.0, forms: [{neg: "ಬೇಡ", pos: "ಬೇಕು", patterns: [NEG-W04]}]}
          N2: {type: neg, p_neg: 1.0, forms: [{neg: "ಕೊಡುವಂತಿಲ್ಲ", pos: "ಕೊಡಬಹುದು", patterns: [NEG-S01]}]}
        turns:
          - {role: patient, text: "[[s1|ನೆಗಡಿ]] ಇದೆ, ಆಂಟಿಬಯಾಟಿಕ್ ಕೊಡಿ."}
          - {role: pharmacist, text: "ನೆಗಡಿಗೆ [[m1|{D1.name} {N1}]]."}
          - {role: pharmacist, text: "[[a1|ವೈದ್ಯರ ಚೀಟಿ ಇಲ್ಲದೆ ಆಂಟಿಬಯಾಟಿಕ್ {N2}]]."}
        items:
          - {kind: symptom, span: s1, name: cold}
          - {kind: medication, span: m1, slot: D1, neg: N1}
          - {kind: advice, span: a1, text: "antibiotics cannot be given without a doctor's prescription", neg: N2}
  - id: d_no_antibiotic__f2
    templates:
      - id: d3
        encounter: nurse_consult
        grounding: [KN-3, KN-2]
        slots:
          AB: {type: word, choices: ["ಆಂಟಿಬಯಾಟಿಕ್", "antibiotic", "ಪ್ರತಿಜೈವಿಕ"]}
          S2: {type: symptom, pool: [fever, cough, headache]}
          N1: {type: neg, forms: EXIST, p_neg: 0.8}
          N2:
            type: neg
            p_neg: 1.0
            forms:
              - {neg: "ಕೊಡುವುದು ಬೇಡಿ", pos: "ಕೊಡಿ", patterns: [NEG-W05]}
              - {neg: "ಬೇಡ", pos: "ಬೇಕು", patterns: [NEG-W04]}
        turns:
          - {role: nurse, text: "ಮಗುವಿಗೆ [[s1|ನೆಗಡಿ]] ಮಾತ್ರ ಇದೆಯಾ?"}
          - {role: caregiver, text: "ಹೌದು, [[s2|{S2.kn} {N1}]]."}
          - {role: nurse, text: "[[a1|ಹಾಗಾದರೆ {AB} {N2}]]. [[a2|ಬಿಸಿ ನೀರು ಕುಡಿಸಿ]]."}
        items:
          - {kind: symptom, span: s1, name: cold}
          - {kind: symptom, span: s2, slot: S2, neg: N1}
          - {kind: advice, span: a1, text: "then do not give antibiotics", neg: N2}
          - {kind: advice, span: a2, text: "give warm water to drink"}
      - id: d4
        encounter: physician_consult
        grounding: [KN-3]
        slots:
          D1: {type: drug, where: {class: [analgesic_antipyretic, antihistamine]}, dose: given}
          N1: {type: neg, p_neg: 1.0, forms: [{neg: "ಬೇಕಾಗುವುದಿಲ್ಲ", pos: "ಬೇಕಾಗುತ್ತದೆ", patterns: [NEG-S02, NEG-S01]}]}
          X1: {type: xturn, p_neg: 0.5}
        turns:
          - {role: patient, text: "ಡಾಕ್ಟರೇ, [[s1|ಕೆಮ್ಮು]] ಮತ್ತು [[s2|ನೆಗಡಿ]] ಇದೆ."}
          - {role: physician, text: "[[a1|ವೈರಲ್ ಸೋಂಕಿಗೆ ಆಂಟಿಬಯಾಟಿಕ್‌ಗಳು {N1}]]."}
          - {role: patient, text: "ಸರಿ, [[m1|{D1.name} {D1.dose}]] ತೆಗೆದುಕೊಳ್ಳಬಹುದಾ?"}
          - {role: physician, text: "{X1}"}
        items:
          - {kind: symptom, span: s1, name: cough}
          - {kind: symptom, span: s2, name: cold}
          - {kind: advice, span: a1, text: "antibiotics are not needed for a viral infection", neg: N1}
          - {kind: medication, span: m1, slot: D1, fields: [dose], neg: X1}
      - id: d5
        encounter: physician_consult
        grounding: [KN-3, KN-2]
        slots:
          AB: {type: word, choices: ["ಆಂಟಿಬಯಾಟಿಕ್", "antibiotic", "ಪ್ರತಿಜೈವಿಕ"]}
          D1: {type: drug, where: {class: [analgesic_antipyretic]}, dose: given, needs: [freq, dur]}
          N1:
            type: neg
            p_neg: 1.0
            forms:
              - {neg: "ಬೇಡ", pos: "ಬೇಕು", patterns: [NEG-W04]}
              - {neg: "ತೆಗೆದುಕೊಳ್ಳಬಾರದು", pos: "ತೆಗೆದುಕೊಳ್ಳಬಹುದು", patterns: [NEG-S04]}
        turns:
          - {role: patient, text: "[[s1|ಜ್ವರ]] ಮತ್ತು [[s2|ಮೈಕೈನೋವು]] ಇದೆ."}
          - {role: physician, text: "ಇದು ವೈರಲ್ ಜ್ವರ, ಆದ್ದರಿಂದ [[a1|{AB} {N1}]]."}
          - {role: physician, text: "[[m1|{D1.name} {D1.dose_tab} {D1.freq} {D1.dur}]] ತೆಗೆದುಕೊಳ್ಳಿ."}
        items:
          - {kind: symptom, span: s1, name: fever}
          - {kind: symptom, span: s2, name: "body ache"}
          - {kind: advice, span: a1, text: "do not take antibiotics", neg: N1}
          - {kind: medication, span: m1, slot: D1, fields: [dose, freq, dur]}
