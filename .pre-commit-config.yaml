# Install once: uv run pre-commit install
# Versions match uv.lock (ruff 0.17.4); tags resolved with `git ls-remote` on 2026-11-09.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
