    kn: [ಉಸಿರಾಟದ ತೊಂದರೆ, ಉಸಿರಾಟಕ್ಕೆ ತೊಂದರೆ]
    latin: []
    source: "dev-tune gold (ಉಸಿರಾಟದ ತೊಂದರೆ); KN-2 via m1 (ಉಸಿರಾಟಕ್ಕೆ ತೊಂದರೆ). Multi-token form"
